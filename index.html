<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030304"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>OmniVolt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#030304;--sf:#0F1115;--fg:#fff;--mu:#94A3B8;--bd:rgba(255,255,255,.1);--or:#F7931A;--bo:#EA580C;--gd:#FFD600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background-size:50px 50px;background-image:linear-gradient(to right,rgba(30,41,59,.5) 1px,transparent 1px),linear-gradient(to bottom,rgba(30,41,59,.5) 1px,transparent 1px);-webkit-mask-image:radial-gradient(circle at center,#000 30%,transparent 100%);mask-image:radial-gradient(circle at center,#000 30%,transparent 100%);z-index:-1}
body:after{content:"";position:fixed;top:-120px;left:50%;width:500px;height:400px;margin-left:-250px;background:var(--or);opacity:.1;filter:blur(120px);z-index:-1}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;line-height:1.15;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.g{background:linear-gradient(to right,var(--or),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1100px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.logo{font:700 22px 'Space Grotesk';display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--or);box-shadow:0 0 14px var(--or);animation:ping 2s infinite}
@keyframes ping{50%{opacity:.35}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:all .3s}
.card:hover{border-color:rgba(247,147,26,.5);box-shadow:0 0 30px -10px rgba(247,147,26,.2)}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(12px)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:1fr 1fr}
button{font:600 13px Inter;letter-spacing:.08em;text-transform:uppercase;min-height:44px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;color:#fff;background:linear-gradient(to right,var(--bo),var(--or));box-shadow:0 0 20px -5px rgba(234,88,12,.5);transition:all .3s}
button:hover{transform:scale(1.05);box-shadow:0 0 30px -5px rgba(247,147,26,.6)}
button.o{background:none;border:2px solid rgba(255,255,255,.2);box-shadow:none}
button.o:hover{border-color:#fff;background:rgba(255,255,255,.1)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
input,select{width:100%;height:48px;background:rgba(0,0,0,.5);color:#fff;border:0;border-bottom:2px solid rgba(255,255,255,.2);padding:0 16px;font:14px Inter;margin:6px 0 14px}
input:focus{border-color:var(--or);box-shadow:0 10px 20px -10px rgba(247,147,26,.3)}
label{font:12px 'JetBrains Mono';color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.mu{color:var(--mu)}.sm{font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.tabs button{background:none;box-shadow:none;border:1px solid var(--bd);padding:0 16px;color:var(--mu)}
.tabs button.on{border-color:var(--or);color:var(--or)}
.pick{cursor:pointer;border:1px solid var(--bd);border-radius:12px;padding:14px;background:rgba(0,0,0,.3)}
.pick.on{border-color:var(--or);box-shadow:0 0 20px -5px rgba(247,147,26,.4)}
.badge{font:11px 'JetBrains Mono';padding:2px 10px;border-radius:99px;border:1px solid rgba(247,147,26,.5);color:var(--or);text-transform:uppercase}
.ok{color:var(--gd);border-color:rgba(255,214,0,.5)}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(to right,var(--bo),var(--gd))}
.pin{font:700 44px 'JetBrains Mono';letter-spacing:.3em;text-align:center}
.slot{height:60px;border-radius:12px;border:1px solid var(--bd);display:grid;place-items:center;font:12px 'JetBrains Mono';color:var(--mu)}
.slot.lit{border-color:var(--gd);color:#000;background:var(--gd);box-shadow:0 0 30px rgba(255,214,0,.6);animation:ping 1s infinite}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:auto;z-index:9;background:var(--sf);border:1px solid var(--or);box-shadow:0 0 40px -10px rgba(247,147,26,.5);border-radius:16px;padding:16px}
#chatb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8}
#chat{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));z-index:8;display:none}
#msgs{height:240px;overflow:auto;font-size:14px}
.m{margin:6px 0;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06)}.m.u{background:rgba(247,147,26,.15);text-align:right}
svg text{font:10px 'JetBrains Mono';fill:#94A3B8}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* mobile-first overrides */
html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
.wrap{max-width:520px;padding:12px 16px 96px}
input,select{font-size:16px}
button{min-height:48px}
h1{font-size:28px!important}
.pin{font-size:34px;letter-spacing:.2em}
.card{padding:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;border-radius:0;min-height:58px;padding:0 4px;font-size:11px;letter-spacing:.04em;transform:none;box-shadow:none;background:none}
.tabs button.on{color:var(--or);background:rgba(247,147,26,.08);box-shadow:inset 0 2px 0 var(--or)}
.toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#chatb{bottom:calc(74px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 18px}
#chat{left:16px;right:16px;width:auto;bottom:calc(130px + env(safe-area-inset-bottom,0px))}
#msgs{height:220px}
.slot{height:52px;font-size:10px}
.tabs{display:flex}.tabs button{flex:1;font-size:10px}textarea{width:100%;background:rgba(0,0,0,.5);color:#fff;border:0;border-bottom:2px solid rgba(255,255,255,.2);padding:12px 16px;font:16px Inter;margin:6px 0 14px;min-height:96px}textarea:focus{outline:0;border-color:var(--or)}button:disabled{opacity:.5}
</style></head><body><div class="wrap" id="app"></div>
<div id="chat" class="card glass"><b class="mono sm">OMNI-BOT · HELP</b><div id="msgs"></div><input id="ci" placeholder="Ask about rentals, PIN, returns…" aria-label="Chat message"></div>
<button id="chatb" aria-label="Open help chat">Help</button><div id="tw"></div>
<script>
const CATS={std:{n:'OmniStandard · Phone',d:'Mobile charging',p:'5V / 10W',b:30,x:22,dr:.05,c:'📱'},lap:{n:'OmniStandard · Laptop',d:'USB-C laptop charging',p:'65W',b:45,x:33,dr:.12,c:'💻'},fast:{n:'OmniFast',d:'Laptop + phone simultaneously, fast',p:'100W dual',b:65,x:49,dr:.2,c:'⚡'},wl:{n:'OmniWireless',d:'Magnetic wireless charging',p:'15W MagSafe-style',b:35,x:27,dr:.08,c:'🧲'}};
const ST=[{id:'S1',n:'Central Library',x:170,y:120,lat:12.9238,lng:77.4986},{id:'S2',n:'Main Gate',x:320,y:240,lat:12.9225,lng:77.4993},{id:'S3',n:'Food Court',x:290,y:90,lat:12.9243,lng:77.4993},{id:'S4',n:'Hostel Block',x:70,y:190,lat:12.9250,lng:77.4980}].map((s,i)=>({...s,slots:8,free:3+i,stock:{std:3,lap:2,fast:1+i%2,wl:2},solar:200+i*40,batt:70+i*5,temp:34,ok:true}));
let S={user:null,pos:{x:200,y:150},cat:'std',dur:2,role:'student',tab:'rent',rent:null,speed:1,pick:null,slot:null,dev:false};
try{const u=localStorage.getItem('ov_user');if(u)S.user=JSON.parse(u)}catch(e){}
let P=null,TX=[],C=[{id:1,src:'Station sensor',user:'system',type:'Faulty power bank',station:'Hostel Block',pb:'OV-F-014',text:'Overheating detected (52°C), auto-locked.',status:'Open'},{id:2,src:'student@rvce.edu.in',user:'student@rvce.edu.in',type:'Billing',station:'Central Library',pb:'',text:'Charged twice for a 2h rental.',status:'Open'}];S.pm='upi';S.at='st';
try{P=JSON.parse(localStorage.getItem('ov_p')||'null');TX=JSON.parse(localStorage.getItem('ov_t')||'[]');C=JSON.parse(localStorage.getItem('ov_c')||'null')||C}catch(e){}
const sv=()=>{try{localStorage.setItem('ov_p',JSON.stringify(P));localStorage.setItem('ov_t',JSON.stringify(TX));localStorage.setItem('ov_c',JSON.stringify(C))}catch(e){}};
const price=(k,h)=>CATS[k].b+(h-1)*CATS[k].x,hasPass=k=>P&&P.exp>Date.now()&&(P.type==='all'||k==='std');
const bd=(k,h)=>hasPass(k)?'Covered by your pass: ₹0':`₹${CATS[k].b} first hr${h>1?` + ${h-1}×₹${CATS[k].x} extra`:''} = ₹${price(k,h)}`;
const rbl=b=>`${hasPass(S.cat)?'Rent free (pass)':'Pay ₹'+price(S.cat,S.dur)} · ${b.n}`;
function upd(){document.querySelector('label[for=du] b').textContent=S.dur+' h';$('#pr').textContent=bd(S.cat,S.dur);$('#rb').textContent=rbl(S.pick||best())}
const tabs=(T,c,k)=>`<nav class="tabs" aria-label="Main">${T.map(t=>`<button class="${c==t[0]?'on':''}" onclick="S.${k}='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`;
const AT=[['st','📡 Stations'],['cp','📝 Complaints'],['fl','⚠️ Faulty']];
function adm(){const f=S.at==='fl',L=C.filter(c=>f?c.type==='Faulty power bank':c.type!=='Faulty power bank');return `<h1 style="margin:8px 0">${f?'Faulty':'Student'} <span class="g">${f?'Power Banks':'Complaints'}</span></h1><p class="mu sm mono">${L.length} entries</p>`+(L.length?L.map(c=>`<div class="card" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${c.type}</b><span class="badge ${c.status=='Open'?'':'ok'}">${c.status}</span></div><p class="sm mono mu">${c.station}${c.pb?' · '+c.pb:''} · ${c.src}</p><p class="sm">${c.text}</p><button class="o" onclick="rs(${c.id})">${c.status=='Open'?(f?'Remove from service':'Mark resolved'):'Reopen'}</button></div>`).join(''):'<div class="card mu">Nothing here.</div>')}
function rs(id){const c=C.find(x=>x.id==id);c.status=c.status=='Open'?'Resolved':'Open';sv();render()}
function cmp(){const t=$('#ct').value.trim();if(t.length<5)return $('#ce').textContent='Please describe the issue.';C.unshift({id:Date.now(),src:S.user.email,user:S.user.email,type:$('#cty').value,station:$('#cst').value,pb:$('#cpb').value.trim(),text:t,status:'Open'});sv();toast('Complaint submitted. Management will contact you on '+S.user.phone);render()}
function buy(t){S.cart={kind:'pass',type:t,amt:t=='all'?999:399,label:t=='all'?'Semester pass · All categories':'Semester pass · OmniStandard Phone'};S.tab='pay';render()}
function pay(){const e=$('#pe');if(S.pm=='card'){if(!/^\d{16}$/.test($('#cn').value.replace(/\s/g,'')))return e.textContent='Enter a valid 16-digit card number.';if(!/^\d\d\/\d\d\s+\d{3}$/.test($('#cx').value.trim()))return e.textContent='Use format: MM/YY 123'}else if(!/^[\w.-]+@\w+$/.test($('#up').value.trim()))return e.textContent='Enter a valid UPI ID.';S.paying=1;render();setTimeout(()=>{S.paying=0;fin()},1400)}
function fin(){const c=S.cart;if(c.kind==='pass')P={type:c.type,exp:Date.now()+150*864e5};else go(ST.find(x=>x.id==c.st),c.cat,c.dur);if(c.amt)TX.unshift({t:Date.now(),l:c.label,a:c.amt});sv();S.cart=null;S.tab=c.kind==='pass'?'pass':'active';toast('✅ '+(c.amt?'Payment of ₹'+c.amt+' successful.':'Booked with your pass.'));render()}
function more(b){
 if(S.tab==='pay'){const c=S.cart;if(!c)return '<div class="card mu">Nothing to pay.</div>';return `<div class="card"><label>Order</label><p class="mono sm">${c.label}</p>${c.kind=='rent'?`<p class="sm mu mono">${bd(c.cat,c.dur)}</p>`:''}<h2 class="g" style="font-size:44px">₹${c.amt}</h2><p class="sm mu">Demo checkout. No real money is charged.</p><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><div class="pick ${S.pm!='card'?'on':''}" onclick="S.pm='upi';render()" role="button" tabindex="0">UPI</div><div class="pick ${S.pm=='card'?'on':''}" onclick="S.pm='card';render()" role="button" tabindex="0">Card</div></div>${S.pm=='card'?'<label for="cn">Card number</label><input id="cn" inputmode="numeric" maxlength="19" placeholder="16 digits"><label for="cx">Expiry / CVV</label><input id="cx" placeholder="MM/YY 123">':'<label for="up">UPI ID</label><input id="up" placeholder="name@upi">'}<p id="pe" class="sm" style="color:var(--bo);margin:0 0 8px"></p><button onclick="pay()" ${S.paying?'disabled':''}>${S.paying?'Processing…':'Pay ₹'+c.amt}</button> <button class="o" onclick="S.cart=null;S.tab='rent';render()">Cancel</button></div>`}
 if(S.tab==='pass'){const on=P&&P.exp>Date.now();return `<div class="card"><h3>Semester passes</h3>${on?`<p><span class="badge ok">active</span> ${P.type=='all'?'All categories':'OmniStandard Phone'} · till ${new Date(P.exp).toLocaleDateString()}</p>`:'<p class="mu sm">No active pass.</p>'}<p class="sm mu">Pass rentals are free (up to 6 h each).</p></div><div class="grid" style="margin-top:16px"><div class="card"><span class="badge">📱 Phone</span><h2 class="g" style="font-size:36px">₹399</h2><p class="sm mu">One semester · OmniStandard Phone</p><button onclick="buy('std')">Buy pass</button></div><div class="card"><span class="badge ok">★ Best value</span><h2 class="g" style="font-size:36px">₹999</h2><p class="sm mu">One semester · all 4 categories</p><button onclick="buy('all')">Buy pass</button></div></div>`}
 if(S.tab==='cmp'){const mine=C.filter(c=>c.user==S.user.email);return `<div class="card"><h3>Raise a complaint</h3><label for="cty">Type</label><select id="cty"><option>Faulty power bank</option><option>Station issue</option><option>Billing</option><option>Other</option></select><label for="cst">Station</label><select id="cst">${ST.map(x=>`<option>${x.n}</option>`).join('')}</select><label for="cpb">Power bank ID (optional)</label><input id="cpb" placeholder="e.g. OV-S-102"><label for="ct">Details</label><textarea id="ct"></textarea><p id="ce" class="sm" style="color:var(--bo);margin:0 0 8px"></p><button onclick="cmp()">Submit</button></div>`+mine.map(c=>`<div class="card" style="margin-top:12px"><b>${c.type}</b> <span class="badge ${c.status=='Open'?'':'ok'}">${c.status}</span><p class="sm mu">${c.station} · ${c.text}</p></div>`).join('')}
 if(S.tab==='acct')return b+`<div class="card" style="margin-top:12px"><h3>Payments</h3>${TX.length?TX.map(x=>`<p class="sm mono">${new Date(x.t).toLocaleDateString()} · ${x.l} · <b>₹${x.a}</b></p>`).join(''):'<p class="mu sm">No payments yet.</p>'}</div>`;
 return b}
const $=q=>document.querySelector(q),dist=s=>Math.hypot(s.x-S.pos.x,s.y-S.pos.y)*1.6|0;
const score=(s,ret)=>{if(!s.ok)return 1e9;const need=ret?s.free<1:s.stock[S.cat]<1;return dist(s)+(need?1e6:0)+(8-s.free)*8};
const best=ret=>[...ST].sort((a,b)=>score(a,ret)-score(b,ret))[0];
const pad=n=>String(n).padStart(2,'0'),fmt=t=>{t=Math.max(0,t|0);return pad(t/3600|0)+':'+pad(t%3600/60|0)+':'+pad(t%60)};
function toast(h,btn){$('#tw').innerHTML=`<div class="toast" role="alert">${h}<div style="margin-top:10px"><button class="o" onclick="this.closest('.toast').remove()">Dismiss</button> ${btn||''}</div></div>`}
function login(){const e=$('#em').value.trim().toLowerCase(),p=$('#ph').value.trim(),n=$('#nm').value.trim();
 if(!/^[^@\s]+@rvce\.edu\.in$/.test(e))return $('#er').textContent='Use your RVCE student email (@rvce.edu.in).';
 if(!n||!/^\+?\d{10,13}$/.test(p))return $('#er').textContent='Enter your name and a valid phone number.';
 S.user={email:e,name:n,phone:p};try{localStorage.setItem('ov_user',JSON.stringify(S.user))}catch(x){}render()}
function adminIn(){S.role='admin';S.user={name:'Admin',email:'admin@omnivolt'};render()}
function mapSvg(t){const r=t&&S.pick;return `<svg viewBox="0 0 420 300" width="100%" style="background:rgba(0,0,0,.4);border-radius:12px;cursor:crosshair" onclick="mv(event)" role="img" aria-label="Campus map"><defs><pattern id="p" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1E293B"/></pattern></defs><rect width="420" height="300" fill="url(#p)"/><rect x="12" y="12" width="396" height="262" rx="14" fill="none" stroke="#F7931A" stroke-opacity=".3" stroke-dasharray="5 5"/><rect x="30" y="30" width="90" height="50" rx="6" fill="#1E293B" opacity=".6"/><text x="36" y="58">Academic blocks</text><rect x="330" y="140" width="70" height="60" rx="6" fill="#1E293B" opacity=".6"/><text x="334" y="174">Sports</text><rect x="0" y="282" width="420" height="18" fill="#1E293B"/><text x="150" y="294">MYSURU ROAD</text>
${r?`<line x1="${S.pos.x}" y1="${S.pos.y}" x2="${r.x}" y2="${r.y}" stroke="#F7931A" stroke-width="2" stroke-dasharray="6 4"/>`:''}
${ST.map(s=>`<circle cx="${s.x}" cy="${s.y}" r="${r&&r.id==s.id?13:9}" fill="${s.ok?'#F7931A':'#555'}" opacity=".9"/><text x="${s.x+14}" y="${s.y+4}">${s.n}</text>`).join('')}
<circle cx="${S.pos.x}" cy="${S.pos.y}" r="6" fill="#FFD600"/><text x="${S.pos.x+9}" y="${S.pos.y-8}" style="fill:#FFD600">YOU</text></svg>`}
function mv(e){const b=e.currentTarget.getBoundingClientRect();S.pos={x:(e.clientX-b.left)/b.width*420,y:(e.clientY-b.top)/b.height*300};S.pick=null;render()}
function start(){const b=S.pick||best(),k=S.cat;if(S.rent)return toast('You already have an active rental.');if(b.stock[k]<1)return toast('No stock at this station for that category.');const a=hasPass(k)?0:price(k,S.dur);S.cart={kind:'rent',st:b.id,cat:k,dur:S.dur,amt:a,label:`${CATS[k].n} · ${S.dur}h · ${b.n}`};if(!a)return fin();S.tab='pay';render()}
function go(b,k,d){S.rent={pin:String(100000+Math.random()*900000|0),st:b,cat:k,dur:d*3600,started:0,batt:100,slot:null,done:false};b.stock[k]--}
function kiosk(){const r=S.rent,v=$('#kp').value;if(v!==r.pin)return $('#ke').textContent='Wrong PIN.';r.slot=1+Math.random()*8|0;r.started=Date.now();r.st.free--;render()}
function retn(){const r=S.rent;const b=best(true);b.free=Math.max(0,b.free-1);b.stock[r.cat]++;S.rent=null;toast(`Returned at <b>${b.n}</b>. Thanks for using solar power ☀️`);render()}
function nav(s){open(`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking`,'_blank','noopener')}
function el(){return S.rent&&S.rent.started?(Date.now()-S.rent.started)/1000*S.speed:0}
function view(){
 if(!S.user)return `<div style="max-width:440px;margin:8vh auto"><div class="logo" style="font-size:32px;margin-bottom:8px"><span class="dot"></span>Omni<span class="g">Volt</span></div><p class="mu">Solar power bank rentals · RVCE campus.</p><div class="card glass"><h2 style="font-size:24px">Student login</h2><label for="nm">Full name</label><input id="nm"><label for="em">Student email</label><input id="em" type="email" placeholder="name@rvce.edu.in"><label for="ph">Contact phone (for management queries)</label><input id="ph" type="tel" placeholder="+91XXXXXXXXXX"><p id="er" class="sm" style="color:var(--bo);margin:0 0 10px"></p><button onclick="login()">Sign in</button> <button class="o" onclick="adminIn()">Admin demo</button></div></div>`;
 const hd=`<header><div class="logo"><span class="dot"></span>Omni<span class="g">Volt</span></div><div class="sm mu mono">${S.user.name} · <a href="#" style="color:var(--or)" onclick="out()">sign out</a></div></header>`;
 if(S.role==='admin')return hd+(S.at!=='st'?adm():`<h1 style="font-size:34px;margin:8px 0 4px">Station <span class="g">Command</span></h1><p class="mu"><span class="badge">● live</span> Data refreshes every 2s (simulated telemetry).</p><div class="grid g2">${ST.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${s.n}</h3><span class="badge ${s.ok?'ok':''}">${s.ok?'online':'offline'}</span></div><div class="grid g2 mono sm" style="margin:12px 0;gap:6px"><span>Slots free <b>${s.free}/${s.slots}</b></span><span>Solar <b>${s.solar|0} W</b></span><span>Temp <b>${s.temp.toFixed(1)}°C</b></span><span>Stock <b>${Object.values(s.stock).reduce((a,b)=>a+b)}</b></span></div><label>Battery reserve ${s.batt|0}%</label><div class="bar" style="margin:6px 0 12px"><i style="width:${s.batt}%"></i></div><div class="sm mu mono">${Object.keys(CATS).map(k=>k+':'+s.stock[k]).join(' · ')}</div><p><button class="o" onclick="ST.find(x=>x.id=='${s.id}').ok=!${s.ok};render()">Toggle status</button></p></div>`).join('')}</div>`)+tabs(AT,S.at,'at');
 const T=[['rent','⚡ Rent'],['active','🔋 Rental'],['pass','🎫 Passes'],['cmp','📝 Complaint'],['acct','👤 Account']];
 let b='';
 if(S.tab==='rent'){const bs=best(),cur=S.pick||bs;b=`<div class="grid g4">${Object.entries(CATS).map(([k,c])=>`<div class="pick ${S.cat==k?'on':''}" onclick="S.cat='${k}';S.pick=null;render()" role="button" tabindex="0"><div style="font-size:24px">${c.c}</div><b class="mono sm">${c.n}</b><div class="sm mu">${c.d}</div><span class="badge">${c.p}</span><div class="sm mono" style="margin-top:6px;color:var(--gd)">₹${c.b}/hr · ₹${c.x} extra hr</div></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><label for="du">Duration: <b class="g">${S.dur} h</b> (max 6h)</label><input id="du" type="range" min="1" max="6" step="1" value="${S.dur}" oninput="S.dur=+this.value;upd()" style="accent-color:#F7931A;padding:0"><p id="pr" class="mono sm" style="color:var(--gd);margin:0 0 8px">${bd(S.cat,S.dur)}</p><h3 style="margin:8px 0">Best station</h3>${[...ST].sort((a,c)=>score(a)-score(c)).map(s=>`<div class="pick ${cur.id==s.id?'on':''}" style="margin:8px 0" onclick="S.pick=ST.find(x=>x.id=='${s.id}');render()"><b>${s.n}</b> ${s.id==bs.id?'<span class="badge ok">best</span>':''}<div class="sm mu mono">${dist(s)} m · ${s.stock[S.cat]} in stock${s.ok?'':' · offline'}</div></div>`).join('')}</div>
 <div class="card">${mapSvg(1)}<p class="sm mu">Tap map to set your position.</p><button id="rb" onclick="start()">${rbl(cur)}</button> <button class="o" onclick="nav(ST.find(x=>x.id=='${cur.id}'))">Navigate</button></div></div>`}
 if(S.tab==='active'){const r=S.rent;if(!r)b=`<div class="card mu">No active rental.</div>`;else{const left=r.dur-el(),bt=Math.max(0,r.batt);b=`<div class="grid g2"><div class="card"><span class="badge">${CATS[r.cat].n}</span><p class="mu sm">Your 6-digit PIN</p><div class="pin g">${r.pin}</div><p class="sm mu" style="text-align:center">Pickup: <b>${r.st.n}</b> · enter PIN at the station kiosk</p>
 ${r.started?`<h2 class="mono g" style="font-size:44px;text-align:center">${fmt(left)}</h2><label>Power bank charge ${bt|0}%</label><div class="bar" style="margin-top:6px"><i style="width:${bt}%"></i></div><p><button onclick="retn()">Return power bank</button></p>`:`<button class="o" onclick="nav(S.rent.st)">Navigate to station</button>`}</div>
 <div class="card"><h3>Station kiosk (simulator)</h3><div class="grid" style="grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0">${[...Array(8)].map((_,i)=>`<div class="slot ${r.slot==i+1?'lit':''}">SLOT ${i+1}</div>`).join('')}</div>${r.started?`<p class="sm">Slot <b>${r.slot}</b> unlocked. Timer started.</p><label>Demo speed</label><select onchange="S.speed=+this.value"><option value="1">1×</option><option value="60" ${S.speed==60?'selected':''}>60× (demo)</option></select>`:`<label for="kp">Enter PIN</label><input id="kp" maxlength="6" inputmode="numeric" class="mono"><p id="ke" class="sm" style="color:var(--bo);margin:0 0 8px"></p><button onclick="kiosk()">Unlock slot</button>`}</div></div>`}}
 if(S.tab==='acct')b=`<div class="card"><h3>Account</h3><p class="mono sm">${S.user.name}<br>${S.user.email}<br>${S.user.phone}</p><p class="sm mu">Contact details are stored so management can reach you about rental queries.</p></div>`;
 return hd+more(b)+tabs(T,S.tab,'tab')}
function out(){S.user=null;S.role='student';try{localStorage.removeItem('ov_user')}catch(e){};render()}
function render(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.id!=='ci')return;$('#app').innerHTML=view()}
setInterval(()=>{ST.forEach(s=>{s.solar=Math.max(80,s.solar+Math.random()*30-15);s.batt=Math.min(100,Math.max(20,s.batt+Math.random()*2-1));s.temp+=Math.random()-.5});const r=S.rent;
 if(r&&r.started){r.batt=100-el()/3600*CATS[r.cat].dr*100*3;if(!r.done&&el()>=r.dur){r.done=true;const b=best(true);toast(`⏰ Time's up! Return your power bank to <b>${b.n}</b> (${dist(b)} m away).`,`<button onclick="nav(ST.find(x=>x.id=='${b.id}'))">Navigate</button>`)}}
 if((S.role==='admin'&&S.at==='st')||(r&&r.started&&S.tab==='active'))render()},2000);
setInterval(()=>{if(S.rent&&S.rent.started&&S.tab==='active')render()},1000);
const KB=[[/price|cost|rate|₹|pass|semester/,'OmniStandard Phone ₹30 first hour + ₹22/extra hr; Laptop ₹45 + ₹33; OmniFast ₹65 + ₹49; OmniWireless ₹35 + ₹27. Semester passes: ₹399 (Standard Phone) or ₹999 (all categories).'],[/complain|faulty|broken|refund/,'Use the Complaint tab to report faulty power banks or billing issues. Management will follow up on your registered contact.'],[/pin/,'Your unique 6-digit PIN appears under "My rental". Enter it at the station kiosk and your slot will light up.'],[/return|late|time/,'When time ends you get an alert with the best station for return. Use Return power bank after docking.'],[/charge|battery|%/,'Charge percentage is shown live on the My rental tab.'],[/wireless|magnet/,'OmniWireless is a magnetic pad charger for compatible phones.'],[/fast|laptop/,'OmniFast charges laptop and phone at once; OmniStandard Laptop suits laptops only.'],[/login|email/,'Only RVCE student emails (@rvce.edu.in) can sign in.'],[/hour|duration|long/,'Rentals run 1 to 6 hours max.']];
function say(t,u){$('#msgs').insertAdjacentHTML('beforeend',`<div class="m ${u?'u':''}">${t}</div>`);$('#msgs').scrollTop=1e5}
$('#chatb').onclick=()=>{const c=$('#chat');c.style.display=c.style.display=='block'?'none':'block';if(!$('#msgs').children.length)say('Hi, I\'m Omni-Bot ⚡ Ask me about PINs, categories, returns or charging.')};
$('#ci').onkeydown=e=>{if(e.key!=='Enter'||!e.target.value.trim())return;const q=e.target.value;e.target.value='';say(q,1);const h=KB.find(k=>k[0].test(q.toLowerCase()));setTimeout(()=>say(h?h[1]:'I\'m not sure. Please contact management via your registered phone/email and we\'ll follow up.'),400)};
render();
</script></body></html>
